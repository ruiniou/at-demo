<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas — Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAFA; --surface:#FFFFFF; --border:#E5E7EB; --border-strong:#D1D5DB;
    --text:#18181B; --text-secondary:#71717A; --text-tertiary:#A1A1AA;
    --accent:#7B1E3D; --accent-hover:#631730; --accent-tint:#FDF1F4; --accent-tint-border:#F3D9DF;
    --status-progress:#B45309; --status-done:#047857; --status-todo:#6B7280; --status-error:#B91C1C;
    --shadow-card:0 1px 2px rgba(0,0,0,0.04); --radius:10px;
    --cover-1:#EFE3E7; --cover-2:#E3EAF0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0F0F10; --surface:#1A1A1C; --border:#2C2C30; --border-strong:#3A3A40;
      --text:#F2F2F3; --text-secondary:#A1A1AA; --text-tertiary:#71717A;
      --accent:#E28FA3; --accent-hover:#EDB0BF; --accent-tint:#2A1920; --accent-tint-border:#4A2530;
      --status-progress:#F0B860; --status-done:#5FD9A6; --status-todo:#A1A1AA; --status-error:#F09999;
      --cover-1:#2A2226; --cover-2:#20262C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F0F10; --surface:#1A1A1C; --border:#2C2C30; --border-strong:#3A3A40;
    --text:#F2F2F3; --text-secondary:#A1A1AA; --text-tertiary:#71717A;
    --accent:#E28FA3; --accent-hover:#EDB0BF; --accent-tint:#2A1920; --accent-tint-border:#4A2530;
    --status-progress:#F0B860; --status-done:#5FD9A6; --status-todo:#A1A1AA; --status-error:#F09999;
    --cover-1:#2A2226; --cover-2:#20262C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
  .app{display:flex;min-height:100vh;}

  .sidebar{width:250px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 12px;max-height:100vh;overflow-y:auto;}
  .logo{font-weight:700;font-size:18px;letter-spacing:0.5px;color:var(--accent);padding:4px 10px 16px 10px;}
  .sidebar-section-label{font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.4px;padding:0 10px;margin-bottom:6px;}

  .recent-row{display:flex;flex-direction:column;padding:6px 10px;border-radius:7px;cursor:pointer;}
  .recent-row:hover{background:var(--bg);}
  .recent-row-top{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;overflow:hidden;}
  .recent-row-top span.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .recent-row-path{font-size:10.5px;color:var(--text-tertiary);margin-left:14px;}

  .tree-search{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:7px;font-size:12.5px;background:var(--bg);color:var(--text);margin:0 0 8px 0;}
  .tree-search:focus{outline:none;border-color:var(--accent);}
  .tree-root{padding:7px 10px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:2px;color:var(--text);}
  .tree-root:hover{background:var(--bg);}
  .tree-root.selected{background:var(--accent-tint);color:var(--accent);}
  .tree-project{margin-bottom:1px;}
  .tree-project-row{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;}
  .tree-project-row:hover{background:var(--bg);}
  .tree-project-row.selected{background:var(--accent-tint);color:var(--accent);}
  .tree-project-row.ancestor{color:var(--accent);}
  .tree-project-row.empty{color:var(--text-tertiary);cursor:default;font-weight:500;}
  .caret{width:14px;height:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);transition:transform .12s ease;cursor:pointer;}
  .caret.collapsed{transform:rotate(-90deg);}
  .tree-count{margin-left:auto;font-size:11px;font-weight:500;color:var(--text-tertiary);}
  .tree-studies{padding-left:18px;}
  .tree-study-row{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text-secondary);}
  .tree-study-row:hover{background:var(--bg);}
  .tree-study-row.selected{background:var(--accent-tint);color:var(--accent);font-weight:600;}
  .study-ta-tag{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--bg);border:1px solid var(--border);color:var(--text-secondary);margin-left:2px;}
  .empty-note{font-size:11px;color:var(--text-tertiary);padding:4px 10px 4px 28px;font-style:italic;}
  .sidebar-divider{height:1px;background:var(--border);margin:14px 4px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-secondary);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;}
  .nav-item:hover{background:var(--bg);}
  .nav-icon{width:16px;height:16px;flex-shrink:0;}
  .sidebar-footer{margin-top:auto;display:flex;align-items:center;gap:8px;padding:10px;color:var(--text-secondary);font-size:13px;}
  .avatar-dot{width:26px;height:26px;border-radius:50%;background:var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--surface);}

  .main{flex:1;padding:24px 28px 40px;min-width:0;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-secondary);cursor:pointer;margin-bottom:10px;}
  .back-link:hover{color:var(--accent);}
  .page-breadcrumb{font-size:12px;color:var(--text-tertiary);margin-bottom:2px;}
  .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;}
  .page-title{font-size:20px;font-weight:700;margin:0;display:flex;align-items:center;gap:10px;}

  .note-banner{background:var(--accent-tint);border:1px solid var(--accent-tint-border);color:var(--accent);font-size:12.5px;padding:8px 12px;border-radius:8px;margin-bottom:16px;display:flex;gap:8px;align-items:flex-start;}
  .note-banner b{font-weight:600;}

  .stat-bar{display:flex;align-items:center;flex-wrap:wrap;padding:10px 0;margin-bottom:16px;border-bottom:1px solid var(--border);}
  .stat-item{display:flex;align-items:baseline;gap:6px;padding:0 16px;}
  .stat-item:first-child{padding-left:0;}
  .stat-item + .stat-item{border-left:1px solid var(--border);}
  .stat-num{font-size:17px;font-weight:700;}
  .stat-lbl{font-size:12px;color:var(--text-secondary);}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
  .toolbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:1;min-width:220px;}
  .toolbar-right{display:flex;align-items:center;gap:8px;}
  .search-box{padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text);width:200px;}
  .search-box:focus{outline:none;border-color:var(--accent);}
  .ta-chip{padding:5px 12px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--text-secondary);cursor:pointer;user-select:none;white-space:nowrap;}
  .ta-chip.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
  .sort-select{padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;background:var(--surface);color:var(--text-secondary);}
  .view-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .view-toggle-btn{padding:6px 9px;background:var(--surface);color:var(--text-tertiary);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .view-toggle-btn.active{background:var(--accent-tint);color:var(--accent);}
  .view-toggle-btn:first-child{border-right:1px solid var(--border);}
  .btn-primary{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn-primary:hover{background:var(--accent-hover);}

  .event-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .event-table th{text-align:left;font-size:11.5px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.3px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg);}
  .event-table td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
  .event-table tr:last-child td{border-bottom:none;}
  .event-table tr.flash td{background:var(--accent-tint);}
  .cell-path{color:var(--text-tertiary);font-size:12.5px;}
  .cell-status{display:flex;align-items:center;gap:6px;font-weight:600;}
  .cell-status.progress{color:var(--status-progress);}
  .cell-status.done{color:var(--status-done);}
  .cell-status.todo{color:var(--text-tertiary);font-weight:500;}
  .cell-status.error{color:var(--status-error);}
  .cell-owner,.cell-date{color:var(--text-secondary);}
  .icon-row{display:flex;gap:12px;color:var(--text-tertiary);}
  .icon-row span{cursor:pointer;}
  .icon-row span:hover{color:var(--text);}
  .version-chip{font-size:11px;color:var(--text-secondary);border:1px solid var(--border-strong);border-radius:5px;padding:1px 6px;margin-left:6px;}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:12px;}
  .event-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;gap:12px;align-items:stretch;transition:box-shadow .15s ease, border-color .15s ease;}
  .event-card.flash{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);}
  .card-left{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;}
  .card-title-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;}
  .card-title{font-size:14px;font-weight:700;}
  .card-path{font-size:12px;color:var(--text-tertiary);margin-bottom:10px;}
  .card-status-line{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;margin-bottom:10px;}
  .card-status-line.progress{color:var(--status-progress);}
  .card-status-line.done{color:var(--status-done);}
  .card-status-line.todo{color:var(--text-tertiary);font-weight:500;}
  .card-status-line.error{color:var(--status-error);}
  .card-actions{display:flex;gap:12px;color:var(--text-tertiary);margin-top:auto;}
  .card-actions span{cursor:pointer;}
  .card-actions span:hover{color:var(--text);}
  .card-cover{flex-shrink:0;width:108px;border-radius:8px;background:linear-gradient(135deg, var(--cover-1), var(--cover-2));display:flex;align-items:center;justify-content:center;}
  .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .dot.progress{background:var(--status-progress);}
  .dot.done{background:var(--status-done);}
  .dot.todo{background:var(--status-todo);}
  .dot.error{background:var(--status-error);}

  .study-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:10px;cursor:pointer;}
  .study-row:hover{border-color:var(--accent);}
  .study-row-left{display:flex;align-items:center;gap:10px;}
  .study-row-name{font-size:14px;font-weight:700;}
  .study-row-meta{font-size:12px;color:var(--text-tertiary);margin-top:2px;}

  .empty-list{padding:40px 20px;text-align:center;color:var(--text-tertiary);font-size:13px;border:1px dashed var(--border-strong);border-radius:var(--radius);}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="logo">ATLAS</div>

    <div class="sidebar-section-label">Recent</div>
    <div id="recentList" style="margin-bottom:14px;"></div>

    <div class="sidebar-section-label">Events</div>
    <input class="tree-search" id="treeSearch" placeholder="搜索 Project / Study" />
    <div class="tree-root" id="allEventsRoot">全部 Events</div>
    <div id="treeList"></div>

    <div class="sidebar-divider"></div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="12" width="18" height="8" rx="1"/></svg>
      Studies
    </div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      Projects
    </div>

    <div class="sidebar-footer"><div class="avatar-dot">U</div>User account</div>
  </div>

  <div class="main"><div id="mainArea"></div></div>
</div>

<script>
const DATA = {
  projects: [
    { id:'PRO001', name:'PRO001', studies:[
      { id:'AZE2001-301', ta:'Oncology', events:[
        { name:'Safety Monitoring Report', version:'2.2', by:'Tom', date:'2025-11-11', status:'ai', detail:'AI Processing' },
        { name:'CSR Interim Analysis', version:'2.2', by:'Tom', date:'2025-11-11', status:'progress', detail:'14/15 TLF Completed' },
        { name:'DSMB Q1 Report', version:'2.2', by:'Tom', date:'2025-11-11', status:'done', detail:'8/8 TLF Completed' },
        { name:'Final CSR', version:'2.2', by:'Tom', date:'2025-11-11', status:'todo', detail:'0/12 TLF Completed' },
        { name:'PK Analysis Report', version:'2.2', by:'Tom', date:'2025-11-11', status:'error', detail:'Shell file parsing failed.' },
      ]},
      { id:'AZE2002-105', ta:'Oncology', events:[
        { name:'Interim CSR Draft', version:'1.4', by:'Mia', date:'2025-10-02', status:'progress', detail:'5/9 TLF Completed' },
        { name:'DSMB Q2 Report', version:'1.4', by:'Mia', date:'2025-09-18', status:'done', detail:'6/6 TLF Completed' },
      ]}
    ]},
    { id:'PRO002', name:'PRO002', studies:[
      { id:'CVD3001-201', ta:'Cardiology', events:[
        { name:'Annual Safety Update', version:'1.0', by:'Alex', date:'2025-08-30', status:'done', detail:'10/10 TLF Completed' },
        { name:'Efficacy Interim Analysis', version:'1.1', by:'Alex', date:'2025-09-10', status:'progress', detail:'3/8 TLF Completed' },
      ]},
      { id:'CVD3002-110', ta:'Neurology', events:[
        { name:'Final Statistical Report', version:'1.0', by:'Jin', date:'2025-07-01', status:'todo', detail:'0/6 TLF Completed' },
      ]}
    ]}
  ]
};
const TA_LIST = ['Oncology', 'Cardiology', 'Neurology'];
const RECENTS = [
  {name:'CSR Interim Analysis',projectId:'PRO001',studyId:'AZE2001-301',status:'progress'},
  {name:'PK Analysis Report',projectId:'PRO001',studyId:'AZE2001-301',status:'error'},
  {name:'Efficacy Interim Analysis',projectId:'PRO002',studyId:'CVD3001-201',status:'progress'},
  {name:'Annual Safety Update',projectId:'PRO002',studyId:'CVD3001-201',status:'done'},
];

let state = {
  page:'home', // 'home' | 'study' | 'project'
  selectedProject:null, selectedStudy:null,
  taFilter:new Set(), expanded:new Set(DATA.projects.map(p=>p.id)),
  treeSearch:'', eventSearch:'', flashEvent:null, view:'list',
};

function findProject(id){ return DATA.projects.find(p=>p.id===id); }
function findStudy(project,id){ return project.studies.find(s=>s.id===id); }
function studyMatchesTA(s){ return state.taFilter.size===0 || state.taFilter.has(s.ta); }
function studyMatchesSearch(p,s){ if(!state.treeSearch) return true; const q=state.treeSearch.toLowerCase(); return p.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q); }
function statusMeta(status){
  switch(status){
    case 'progress': return {cls:'progress',dot:'progress',label:'In Progress'};
    case 'done': return {cls:'done',dot:'done',label:'Completed'};
    case 'todo': return {cls:'todo',dot:'todo',label:'To do'};
    case 'error': return {cls:'error',dot:'error',label:'Parse Failed'};
    case 'ai': return {cls:'progress',dot:'progress',label:'AI Processing'};
    default: return {cls:'todo',dot:'todo',label:status};
  }
}
function coverIcon(){
  return `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--accent);opacity:0.5;"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 3 5-7"/></svg>`;
}

// ---------- Sidebar: recent ----------
function renderRecent(){
  document.getElementById('recentList').innerHTML = RECENTS.map(r=>{
    const meta=statusMeta(r.status);
    return `
      <div class="recent-row" data-recent-project="${r.projectId}" data-recent-study="${r.studyId}" data-recent-name="${r.name}">
        <div class="recent-row-top"><span class="dot ${meta.dot}"></span><span class="name">${r.name}</span></div>
        <div class="recent-row-path">${r.projectId} / ${r.studyId}</div>
      </div>
    `;
  }).join('');
  document.querySelectorAll('[data-recent-project]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.page='study';
      state.selectedProject=el.dataset.recentProject;
      state.selectedStudy=el.dataset.recentStudy;
      state.flashEvent=el.dataset.recentName;
      renderAll();
      setTimeout(()=>{ state.flashEvent=null; renderPage(); }, 1200);
    });
  });
}

// ---------- Sidebar: tree ----------
function renderTree(){
  const root=document.getElementById('allEventsRoot');
  root.classList.toggle('selected', state.page==='home');
  root.onclick=()=>{ state.page='home'; state.selectedProject=null; state.selectedStudy=null; renderAll(); };

  const html=DATA.projects.map(project=>{
    const visibleStudies=project.studies.filter(s=>studyMatchesTA(s)&&studyMatchesSearch(project,s));
    const isProjectSearchMiss = state.treeSearch && !project.name.toLowerCase().includes(state.treeSearch.toLowerCase()) && visibleStudies.length===0;
    if(isProjectSearchMiss) return '';
    const expanded=state.expanded.has(project.id);
    const noMatch=visibleStudies.length===0;
    const eventCount=project.studies.reduce((sum,s)=>sum+s.events.length,0);
    const isCurrentProjectPage = state.page==='project' && state.selectedProject===project.id;
    const isAncestor = state.page==='study' && state.selectedProject===project.id;
    const studiesHtml=visibleStudies.map(study=>`
      <div class="tree-study-row ${state.page==='study'&&state.selectedStudy===study.id?'selected':''}" data-study="${study.id}" data-project="${project.id}">
        ${study.id}<span class="study-ta-tag">${study.ta}</span>
      </div>
    `).join('');
    return `
      <div class="tree-project">
        <div class="tree-project-row ${noMatch?'empty':''} ${isCurrentProjectPage?'selected':''} ${isAncestor?'ancestor':''}">
          <span class="caret ${expanded?'':'collapsed'}" data-caret="${project.id}">▾</span>
          <span data-project-nav="${project.id}" style="flex:1;">${project.name}</span>
          <span class="tree-count">${eventCount}</span>
        </div>
        ${expanded ? (noMatch ? `<div class="empty-note">没有符合筛选条件的 Study</div>` : `<div class="tree-studies">${studiesHtml}</div>`) : ''}
      </div>
    `;
  }).join('');
  document.getElementById('treeList').innerHTML=html;

  document.querySelectorAll('[data-caret]').forEach(el=>{
    el.addEventListener('click',(e)=>{
      e.stopPropagation();
      const pid=el.dataset.caret;
      if(state.expanded.has(pid)) state.expanded.delete(pid); else state.expanded.add(pid);
      renderTree();
    });
  });
  document.querySelectorAll('[data-project-nav]').forEach(el=>{
    el.addEventListener('click',()=>{
      state.page='project'; state.selectedProject=el.dataset.projectNav; state.selectedStudy=null;
      renderAll();
    });
  });
  document.querySelectorAll('[data-study]').forEach(el=>{
    el.addEventListener('click',(e)=>{
      e.stopPropagation();
      state.page='study'; state.selectedProject=el.dataset.project; state.selectedStudy=el.dataset.study;
      renderAll();
    });
  });
}

// ---------- Stat bar ----------
function statBarHTML(events){
  let notStarted=0,inProgress=0,completed=0;
  events.forEach(e=>{
    if(e.status==='todo') notStarted++;
    if(e.status==='progress'||e.status==='ai') inProgress++;
    if(e.status==='done') completed++;
  });
  const stats=[[events.length,'Total'],[notStarted,'Not Started'],[inProgress,'In Progress'],[completed,'Completed']];
  return `<div class="stat-bar">${stats.map(([n,l])=>`<div class="stat-item"><span class="stat-num">${n}</span><span class="stat-lbl">${l}</span></div>`).join('')}</div>`;
}

// ---------- Toolbar + event list (shared by home & study pages) ----------
function toolbarHTML(showTA){
  return `
    <div class="toolbar">
      <div class="toolbar-left">
        <input class="search-box" id="eventSearch" placeholder="Search..." value="${state.eventSearch}" />
        ${showTA ? `<div id="taChips" style="display:flex;gap:6px;flex-wrap:wrap;"></div>` : ''}
      </div>
      <div class="toolbar-right">
        <select class="sort-select"><option>Last edited</option><option>Last viewed by you</option><option>Created</option></select>
        <div class="view-toggle">
          <div class="view-toggle-btn ${state.view==='list'?'active':''}" id="viewList" title="List view">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </div>
          <div class="view-toggle-btn ${state.view==='card'?'active':''}" id="viewCard" title="Card view">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          </div>
        </div>
      </div>
    </div>
  `;
}
function attachToolbarHandlers(){
  document.getElementById('eventSearch').addEventListener('input',(e)=>{ state.eventSearch=e.target.value; renderPage(); });
  document.getElementById('viewList').addEventListener('click',()=>{ state.view='list'; renderPage(); });
  document.getElementById('viewCard').addEventListener('click',()=>{ state.view='card'; renderPage(); });
  const taRoot=document.getElementById('taChips');
  if(taRoot){
    taRoot.innerHTML = TA_LIST.map(ta=>`<div class="ta-chip ${state.taFilter.has(ta)?'selected':''}" data-ta="${ta}">${ta}</div>`).join('');
    taRoot.querySelectorAll('.ta-chip').forEach(el=>{
      el.addEventListener('click',()=>{
        const ta=el.dataset.ta;
        if(state.taFilter.has(ta)) state.taFilter.delete(ta); else state.taFilter.add(ta);
        renderAll();
      });
    });
  }
}
function eventListHTML(events){
  if(events.length===0) return `<div class="empty-list">没有符合当前筛选条件的 Event</div>`;
  if(state.view==='list'){
    const rows=events.map(ev=>{
      const meta=statusMeta(ev.status); const flash=state.flashEvent===ev.name?'flash':'';
      return `
        <tr class="${flash}">
          <td><b>${ev.name}</b><span class="version-chip">${ev.version}</span></td>
          <td class="cell-path">${ev.projectId} / ${ev.studyId}</td>
          <td><div class="cell-status ${meta.cls}"><span class="dot ${meta.dot}"></span>${meta.label}</div></td>
          <td class="cell-owner">${ev.by}</td>
          <td class="cell-date">${ev.date}</td>
          <td><div class="icon-row"><span title="Edit">✎</span><span title="Members">👥</span><span title="Stats">📊</span><span title="Download">⬇</span><span title="Delete">🗑</span></div></td>
        </tr>
      `;
    }).join('');
    return `<table class="event-table"><thead><tr><th>Event 名称</th><th>路径</th><th>状态</th><th>Owner</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
  } else {
    const cards=events.map(ev=>{
      const meta=statusMeta(ev.status); const flash=state.flashEvent===ev.name?'flash':'';
      return `
        <div class="event-card ${flash}">
          <div class="card-left">
            <div>
              <div class="card-title-row"><span class="card-title">${ev.name}</span><span class="version-chip">${ev.version}</span></div>
              <div class="card-path">${ev.projectId} / ${ev.studyId}</div>
              <div class="card-status-line ${meta.cls}"><span class="dot ${meta.dot}"></span>${meta.label} · ${ev.detail}</div>
            </div>
            <div class="card-actions"><span title="Edit">✎</span><span title="Members">👥</span><span title="Stats">📊</span><span title="Download">⬇</span><span title="Delete">🗑</span></div>
          </div>
          <div class="card-cover">${coverIcon()}</div>
        </div>
      `;
    }).join('');
    return `<div class="card-grid">${cards}</div>`;
  }
}

// ---------- Pages ----------
function getHomeEvents(){
  let results=[];
  DATA.projects.forEach(project=>project.studies.forEach(study=>{
    if(!studyMatchesTA(study)) return;
    study.events.forEach(ev=>{
      if(state.eventSearch && !ev.name.toLowerCase().includes(state.eventSearch.toLowerCase())) return;
      results.push({...ev, projectId:project.id, studyId:study.id});
    });
  }));
  return results;
}
function getStudyEvents(project,study){
  return study.events.filter(ev=>!state.eventSearch || ev.name.toLowerCase().includes(state.eventSearch.toLowerCase()))
    .map(ev=>({...ev, projectId:project.id, studyId:study.id}));
}

function renderHomePage(){
  const events=getHomeEvents();
  document.getElementById('mainArea').innerHTML = `
    <div class="page-header"><h1 class="page-title">Events</h1><button class="btn-primary">+ New Event</button></div>
    <div class="note-banner"><span>ⓘ</span><span><b>Demo 说明：</b>Recent 点击后进入对应 Study 页面并高亮定位该 Event（独立 Event 详情页尚未在此 demo 中构建）。封面图为占位样式，非真实 TFL 渲染。</span></div>
    <div id="statBar"></div>
    <div id="toolbar"></div>
    <div id="eventListRoot"></div>
  `;
  document.getElementById('statBar').innerHTML = statBarHTML(events);
  document.getElementById('toolbar').innerHTML = toolbarHTML(true);
  attachToolbarHandlers();
  document.getElementById('eventListRoot').innerHTML = eventListHTML(events);
}

function renderStudyPage(){
  const project=findProject(state.selectedProject);
  const study=findStudy(project, state.selectedStudy);
  const events=getStudyEvents(project, study);
  document.getElementById('mainArea').innerHTML = `
    <div class="back-link" id="backToHome">← 全部 Events</div>
    <div class="page-breadcrumb">${project.id}</div>
    <div class="page-header">
      <h1 class="page-title">${study.id} <span class="study-ta-tag">${study.ta}</span></h1>
      <button class="btn-primary">+ New Event</button>
    </div>
    <div id="statBar"></div>
    <div id="toolbar"></div>
    <div id="eventListRoot"></div>
  `;
  document.getElementById('statBar').innerHTML = statBarHTML(events);
  document.getElementById('toolbar').innerHTML = toolbarHTML(false);
  attachToolbarHandlers();
  document.getElementById('eventListRoot').innerHTML = eventListHTML(events);
  document.getElementById('backToHome').addEventListener('click', ()=>{ state.page='home'; renderAll(); });
}

function renderProjectPage(){
  const project=findProject(state.selectedProject);
  const rows=project.studies.map(study=>{
    const total=study.events.length;
    const inProgress=study.events.filter(e=>e.status==='progress'||e.status==='ai').length;
    return `
      <div class="study-row" data-study-nav="${study.id}">
        <div class="study-row-left">
          <div>
            <div class="study-row-name">${study.id} <span class="study-ta-tag">${study.ta}</span></div>
            <div class="study-row-meta">${total} events · ${inProgress} in progress</div>
          </div>
        </div>
        <div style="color:var(--text-tertiary);">→</div>
      </div>
    `;
  }).join('');
  document.getElementById('mainArea').innerHTML = `
    <div class="back-link" id="backToHome">← 全部 Events</div>
    <div class="page-header"><h1 class="page-title">${project.id}</h1></div>
    <div style="font-size:12.5px;color:var(--text-secondary);margin-bottom:12px;">${project.studies.length} 个 Study</div>
    ${rows}
  `;
  document.getElementById('backToHome').addEventListener('click', ()=>{ state.page='home'; renderAll(); });
  document.querySelectorAll('[data-study-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.page='study'; state.selectedStudy=el.dataset.studyNav;
      renderAll();
    });
  });
}

function renderPage(){
  if(state.page==='home') renderHomePage();
  else if(state.page==='study') renderStudyPage();
  else if(state.page==='project') renderProjectPage();
}
function renderAll(){
  renderRecent();
  renderTree();
  renderPage();
}
renderAll();
</script>
</body>
</html>
